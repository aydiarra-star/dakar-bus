name: Flutter verify (Step 4B)

# Workflow de VÉRIFICATION UNIQUEMENT — Step 4B.
#
# Objet : exécuter `flutter analyze` et `flutter test` sur la source Flutter
#         située dans flutter-src/, parce que l'environnement de travail local
#         ne peut pas installer le SDK Dart (sortie réseau restreinte :
#         storage.googleapis.com, pub.dev et les quatre miroirs de secours
#         ont leur poignée de main TLS interrompue).
#
# Ce workflow ne déploie RIEN :
#   - aucune permission `pages: write` ;
#   - aucun job `deploy` ;
#   - aucun `actions/upload-pages-artifact` ni `actions/deploy-pages` ;
#   - aucune écriture sur la branche gh-pages, ni sur main ;
#   - aucune publication, aucune release, aucun commit de retour,
#     aucun fichier du dépôt modifié.
#
# Les permissions `checks: write` et `statuses: write` servent UNIQUEMENT à
# publier le résultat chiffré de la vérification. Ni un check run ni un statut
# ne modifie de fichier, de branche, et ne peut rien déployer.
#
# Pourquoi ce canal : les journaux de run sont hébergés sur
# results-receiver.actions.githubusercontent.com, inaccessible depuis
# l'environnement de travail. La conclusion `success` d'une étape ne prouve
# donc pas à elle seule que des tests ont été exécutés — `flutter test`
# réussit aussi lorsqu'il ne découvre AUCUN test. La sortie du check run,
# elle, est lisible via api.github.com.
#
# Déclencheurs : la branche de session et l'appel manuel uniquement.

on:
  push:
    branches: [ arena/01a0c385-dakar-bus ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  statuses: write

concurrency:
  group: flutter-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: analyze + test (Flutter 3.24.5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (0 error exigé)
        run: |
          set +e
          flutter analyze > /tmp/analyze.log 2>&1
          echo "analyze_exit=$?" | tee /tmp/analyze.exit
          tail -30 /tmp/analyze.log

      - name: Test
        run: |
          set +e
          flutter test --reporter expanded > /tmp/test.log 2>&1
          echo "test_exit=$?" | tee /tmp/test.exit
          tail -40 /tmp/test.log

      - name: Publier le résultat (check run + statut, aucun fichier modifié)
        if: always()
        run: |
          set +e
          TOKEN="${{ github.token }}"
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          API="https://api.github.com/repos/$REPO"

          AEXIT=$(grep -oE '[0-9]+' /tmp/analyze.exit 2>/dev/null | head -1); AEXIT=${AEXIT:-NA}
          TEXIT=$(grep -oE '[0-9]+' /tmp/test.exit 2>/dev/null | head -1); TEXIT=${TEXIT:-NA}
          PASS=$(grep -oE '\+[0-9]+' /tmp/test.log 2>/dev/null | tail -1 | tr -d '+'); PASS=${PASS:-0}
          FAIL=$(grep -oE '\+[0-9]+ -[0-9]+' /tmp/test.log 2>/dev/null | tail -1 | grep -oE '\-[0-9]+' | tr -d '-'); FAIL=${FAIL:-0}
          SUITES=$(ls test/*_test.dart 2>/dev/null | wc -l | tr -d ' ')
          AISSUES=$(grep -cE '^\s+(error|warning|info)\s' /tmp/analyze.log 2>/dev/null); AISSUES=${AISSUES:-0}

          SUMMARY="tests +$PASS/-$FAIL | $SUITES fichiers | analyze: $AISSUES issue(s) | exit analyze=$AEXIT test=$TEXIT"
          echo "$SUMMARY"

          # --- corps JSON construit par python3 (échappement sûr) ---
          TEXT=$( { echo "=== RÉSUMÉ ==="; echo "$SUMMARY"; \
                    echo; echo "=== flutter analyze (intégral) ==="; cat /tmp/analyze.log 2>/dev/null; \
                    echo; echo "=== flutter test (intégral) ==="; cat /tmp/test.log 2>/dev/null; } | head -c 60000 )
          BODY=$(python3 - "$SUMMARY" "$TEXT" <<'PY'
import json,sys
summary, text = sys.argv[1], sys.argv[2]
print(json.dumps({"output": {"title": "Flutter verify (4B)", "summary": summary, "text": text}}))
PY
          )

          # --- retrouve l'identifiant du check run de ce job ---
          CRID=$(curl -sS -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
                 "$API/commits/$SHA/check-runs" | python3 -c \
                 "import json,sys; d=json.load(sys.stdin); c=[x for x in d.get('check_runs',[]) if 'analyze' in x.get('name','')]; print(c[0]['id'] if c else (d['check_runs'][0]['id'] if d.get('check_runs') else ''))")
          echo "check_run_id=$CRID"

          if [ -n "$CRID" ]; then
            printf '%s' "$BODY" > /tmp/cr.json
            CODE=$(curl -sS -o /tmp/cr.out -w "%{http_code}" -X PATCH \
                   -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
                   "$API/check-runs/$CRID" --data-binary @/tmp/cr.json)
            echo "PATCH check-run -> HTTP $CODE"
          fi

          # --- statut de commit (canal secondaire) ---
          if [ "$FAIL" = "0" ] && [ "$AISSUES" = "0" ] && [ "$PASS" != "0" ] && [ "$AEXIT" = "0" ] && [ "$TEXIT" = "0" ]; then
            STATE=success
          else
            STATE=failure
          fi
          DESC=$(printf '%s' "$SUMMARY" | cut -c1-140)
          SCODE=$(curl -sS -o /tmp/st.out -w "%{http_code}" -X POST \
                  -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
                  "$API/statuses/$SHA" \
                  --data-binary "$(python3 -c "import json,sys; print(json.dumps({'state':sys.argv[1],'description':sys.argv[2],'context':'flutter-4b/decompte'}))" "$STATE" "$DESC")")
          echo "POST statut -> HTTP $SCODE ($STATE)"
          head -c 300 /tmp/st.out 2>/dev/null; echo

          # Le canal est un moyen, pas une fin : l'étape n'échoue que sur un
          # véritable échec analyze/test, jamais sur un échec de publication.
          if [ "$AEXIT" != "0" ] || [ "$TEXIT" != "0" ]; then exit 1; fi
