name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Autorisations requises pour publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Empêche les déploiements simultanés
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Créer le site web
        run: flutter build web --release --base-href "/dakar-bus/"

      - name: Charger l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
