name: debug-analyze
on:
  push:
    branches:
      - arena/01a0df09-dakar-bus
    paths:
      - '.github/workflows/debug-analyze.yml'
      - 'flutter-src/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: flutter-src
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze verbose
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --verbose 2>&1 | tee /tmp/analyze.txt || true
          echo "----- analyze.txt -----"
          cat /tmp/analyze.txt
          dart analyze --verbose 2>&1 | tee /tmp/dart-analyze.txt || true
          echo "----- dart-analyze.txt -----"
          cat /tmp/dart-analyze.txt
      - name: flutter test verbose
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/test.txt || true
          echo "----- test.txt -----"
          cat /tmp/test.txt
      - name: create commit comment with test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          content_test=$(cat /tmp/test.txt 2>/dev/null | tail -n 200)
          content_test=$(echo "$content_test" | head -c 15000)
          # escape for json
          body=$(printf "TEST OUTPUT:\n\`\`\`\n%s\n\`\`\`" "$content_test")
          jq -n --arg body "$body" '{body: $body}' > /tmp/comment.json
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments --input /tmp/comment.json 2>&1 | tee /tmp/comment.out || true
          cat /tmp/comment.out || true
          echo "done"
