name: debug-analyze
on:
  push:
    branches:
      - arena/01a0df09-dakar-bus
    paths:
      - '.github/workflows/debug-analyze.yml'
      - 'flutter-src/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: flutter-src
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze verbose
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --verbose 2>&1 | tee /tmp/analyze.txt || true
          echo "----- analyze.txt -----"
          cat /tmp/analyze.txt
          dart analyze --verbose 2>&1 | tee /tmp/dart-analyze.txt || true
          echo "----- dart-analyze.txt -----"
          cat /tmp/dart-analyze.txt
      - name: flutter test verbose
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/test.txt || true
          echo "----- test.txt -----"
          cat /tmp/test.txt
      - name: create issue with analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          content_analyze=$(cat /tmp/analyze.txt)
          content_test=$(cat /tmp/test.txt | head -c 40000)
          body="ANALYZE:\n$content_analyze\n\nTEST:\n$content_test"
          body=$(echo "$body" | head -c 60000)
          jq -n --arg body "$body" '{title: "debug analyze+test", body: $body}' > /tmp/issue.json
          gh api repos/${{ github.repository }}/issues --input /tmp/issue.json 2>&1 | tee /tmp/issue.out
          cat /tmp/issue.out
