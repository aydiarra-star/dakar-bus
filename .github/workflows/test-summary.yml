name: test-summary
on:
  push:
    branches:
      - arena/01a0df09-dakar-bus
    paths:
      - 'flutter-src/**'
      - '.github/workflows/test-summary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: flutter-src
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter test --reporter expanded 2>&1 | tee /tmp/test.txt || true
      - run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/test.txt | tail -n 200 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/test.txt | grep -E "FAILED|Expected|Actual" | head -n 100 >> $GITHUB_STEP_SUMMARY || true
      - name: Create issue with test log
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== test.txt exists? ===" 
          ls -lh /tmp/test.txt || true
          echo "=== tail ==="
          tail -n 50 /tmp/test.txt || true
          echo "=== grep ==="
          grep -E "FAIL|Expected|Actual" /tmp/test.txt | head -n 20 || true
          content=$(cat /tmp/test.txt 2>/dev/null | grep -E "FAIL|Expected|Actual" | head -n 100 | head -c 6000)
          if [ -z "$content" ]; then
            content=$(cat /tmp/test.txt 2>/dev/null | tail -n 50 | head -c 6000)
          fi
          echo "=== content ==="
          echo "$content" | head -n 20
          body=$(printf "TEST LOG for %s:\n\`\`\`\n%s\n\`\`\`" "${{ github.sha }}" "$content")
          echo "$body" > /tmp/body.txt
          cat /tmp/body.txt | head -n 30
          jq -n --arg body "$(cat /tmp/body.txt)" --arg title "test log ${{ github.sha }}" '{title: $title, body: $body}' > /tmp/issue.json
          cat /tmp/issue.json | head -n 20
          gh api repos/${{ github.repository }}/issues --input /tmp/issue.json 2>&1 | tee /tmp/issue.out || true
          cat /tmp/issue.out || true
          echo "=== gh api done ==="
          cat /tmp/issue.out | head -n 20
          echo "## Test Log Issue" >> $GITHUB_STEP_SUMMARY
          cat /tmp/issue.out >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/body.txt | head -n 30 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
