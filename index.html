<!DOCTYPE html>
<html>
<head>
  <script>window.flutterConfiguration = { canvasKitBaseUrl: "canvaskit/" };</script>
  <base href="/dakar-bus/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dakar Bus - Réseau multimodal Dakar : TER, BRT, DDD, AFTU, Tata. Planificateur d'itinéraires, carte temps réel, assistant IA.">
  <meta name="theme-color" content="#00B140">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dakar Bus">
  <link rel="manifest" href="manifest.json">
  <title>Dakar Bus - TER • BRT • DDD • AFTU • Tata</title>
  <script>
    // Capture l'onglet demandé AVANT le boot Flutter (le moteur écrase le hash ensuite).
    try { localStorage.setItem('dakarbus_initial_hash', window.location.hash || ''); } catch (e) {}
  </script>
</head>
<body>
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: "477962403" },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
