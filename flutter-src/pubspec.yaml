name: dakar_bus
description: Application multimodale de transport en commun à Dakar - TER, BRT, DDD, AFTU, Tata (117 arrêts, 105 lignes dont 1 TER, 2 BRT, 80 AFTU, 15 DDD et 7 Tata) - Réseau complet CETUD/SETER.
publish_to: 'none'

# Version cible validée par la Phase 0 (§2.5) : 9.3.2+12.
#
# Justification : c'est l'identité de la production actuellement servie. Le
# tip de gh-pages (94a84b60) porte version.json = 9.3.2 / build 12 et le
# binaire affiche « v9.3.2 build 12 » ; les deux concordent.
#
# Ce champ pilote la régénération de version.json par le build. Le laisser à
# 9.3.0+4 ferait régresser version.json et perdrait l'identité production.
# Les paliers 9.3.1+5 puis 9.3.2+6..12 n'ont jamais existé dans un pubspec :
# ils n'ont été écrits que dans version.json, sur gh-pages.
#
# « v9.4 » n'est PAS une version : c'était une chaîne d'interface codée en dur
# (main.dart ligne 1978), incohérente avec le pubspec 9.3.0+4 de l'époque, et
# remplacée le 2026-09-18 par le commit gh-pages a0ae515c4d. Ne pas la créer.
#
# 9.3.3+13 (2026-09-24) : position utilisateur soumise à PositionValidity
# (plausibilité géodésique) et non plus à DakarBounds ; message de refus GPS
# définitif orienté action ; tests réalignés sur la source unique TER/BRT
# (PR #20). La vérification J9 reste une auto-cohérence version.json ←
# pubspec.yaml : ce champ est la seule source de la version.
version: 9.3.3+13

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/dakar_network.json
    # Référentiel de fréquences du moteur de départs (2026-09-25) — miroir
    # strict de data/transit/departure-frequencies.json.
    - assets/data/departure-frequencies.json
